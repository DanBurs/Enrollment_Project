{% extends "base.html"%}

{%block module%}

<div class="container">
    <div class="title_row">
        <div class="col-md-12 text-center">
            <h1> <strong> Welcome to BLT University! </strong> </h1>
            {% if session ['username'] %}
            <h3> <strong> Let's Start An Adventure Together! </strong> </h3>
            {% else %}
            <p>Have you already registered? <a href = "{{url_for('login')}}"">Login</a></p>
            {% endif %}
        </div>
    </div>
</div>    
<div class="container-fluid py-5 text-center">    
    <div id="homeCarouselElement" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{{url_for('static', filename ='images/dom-fou-YRMWVcdyhmI-unsplash.jpg')}}" class="d-block w-100" >
            </div>
            <div class="carousel-item">
                <img src="{{url_for('static', filename ='images/erika-fletcher-MZxqc6n9qCw-unsplash.jpg')}}" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="{{url_for('static', filename ='images/juni-nguyen-sqvyjtoQC2I-unsplash.jpg')}}" class="d-block w-100" >
            </div>
            <div class="carousel-item">
                <img src="{{url_for('static', filename ='images/nathan-dumlao-ewGMqs2tmJI-unsplash.jpg')}}" class="d-block w-100" >
            </div>
            <div class="carousel-item">
                <img src="{{url_for('static', filename ='images/porter-raab-gnj9vj--FRY-unsplash.jpg')}}" class="d-block w-100" >
            </div>
            <div class="carousel-item">
                <img src="{{url_for('static', filename ='images/robert-bye-CyvK_Z2pYXg-unsplash.jpg')}}" class="d-block w-100" >
            </div>
            <div class="carousel-item">
                <img src="{{url_for('static', filename ='images/ronni-kurtz-e17b7HW89vc-unsplash.jpg')}}" class="d-block w-100" >
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#homeCarouselElement" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#homeCarouselElement" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</div>  

{% endblock%}
